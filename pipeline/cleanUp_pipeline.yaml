trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: cloud-credentials
  - name: pythonVersion
    value: '3.9'

stages:
  - stage: Cleanup
    displayName: 'Cloud Resource Cleanup'
    jobs:
      - job: RunCleanup
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Set Python Version'

          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            displayName: 'Install Dependencies'

          - task: GoogleCloudSdkInstaller@0
            displayName: 'Install Google Cloud SDK'

          - task: GoogleCloudAuthenticate@0
            inputs:
              serviceAccountKey: $(GCP_SERVICE_ACCOUNT_KEY)
              projectId: $(GCP_PROJECT_ID)
            displayName: 'Authenticate with GCP'

          - task: PythonScript@0
            inputs:
              scriptSource: 'filePath'
              scriptPath: '$(System.DefaultWorkingDirectory)/run.py'
              arguments: '--cloud-providers gcp --execute'
            displayName: 'Run GCP Cleanup'
            env:
              GCP_PROJECT_ID: $(GCP_PROJECT_ID)

          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: >
                python run.py --cloud-providers azure --execute
            displayName: 'Run Azure Cleanup'
